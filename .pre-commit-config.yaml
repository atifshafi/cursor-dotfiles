repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: gitleaks git --pre-commit --redact --no-banner
        language: system
        pass_filenames: false
      - id: block-secrets-yaml
        name: Block secrets.yaml from commit
        entry: ./scripts/block-secrets.sh
        language: script
        pass_filenames: false
        always_run: true
